# Suricata NIDS Configuration Snippet for Wazuh EVE JSON Ingestion
# Target: Rocky Linux 9.8 (rhel-endpoint-01)
# Path: /etc/suricata/suricata.yaml

%YAML 1.1
---
default-log-dir: /var/log/suricata/

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            packet: yes
            metadata: yes
            tagged-packets: yes
        - http:
            extended: yes
        - dns:
            version: 2
        - tls:
            extended: yes
        - ssh
        - flow

af-packet:
  - interface: ens160
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
