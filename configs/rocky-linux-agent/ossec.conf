<!--
  Wazuh Agent Configuration - Rocky Linux 9.8 Enterprise
  Author: Mahi Al Jaber (github.com/mahialjaber)
  Target Node: rhel-endpoint-01 (192.168.198.132 | Agent 002)
  Path: /var/ossec/etc/ossec.conf
-->

<ossec_config>
  <client>
    <server>
      <address>192.168.198.130</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ======================================================== -->
  <!-- REAL-TIME FILE INTEGRITY MONITORING (FIM)                -->
  <!-- ======================================================== -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    
    <!-- Real-time monitoring with differential analysis -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc,/usr/bin,/usr/sbin,/root</directories>
    <directories check_all="yes" realtime="yes">/bin,/sbin,/boot</directories>
  </syscheck>

  <!-- ======================================================== -->
  <!-- LOG INGESTION: Auditd, Syslog & Suricata NIDS             -->
  <!-- ======================================================== -->
  <!-- Authentication & System Logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <!-- Linux Auditd Subsystem Logs -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Suricata NIDS JSON Event Stream -->
  <localfile>
    <log_format>suricata</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

</ossec_config>
