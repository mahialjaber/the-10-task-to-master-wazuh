<!--
  Wazuh Manager Configuration (Sanitized Enterprise Deployment)
  Author: Mahi Al Jaber (github.com/mahialjaber)
  Target Node: Ubuntu Manager (192.168.198.130)
  Path: /var/ossec/etc/ossec.conf
-->

<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <!-- Central Agent Communication -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- ======================================================== -->
  <!-- CLOUD SIEM: AWS CloudTrail Ingestion via S3 Polling       -->
  <!-- ======================================================== -->
  <wodle name="aws-s3">
    <disabled>no</disabled>
    <interval>5m</interval>
    <run_on_start>yes</run_on_start>
    <service type="cloudtrail">
      <bucket name="for-wazuh1">
        <aws_profile>default</aws_profile>
      </bucket>
    </service>
  </wodle>

  <!-- ======================================================== -->
  <!-- ACTIVE DEFENSE: Dynamic Automated Firewall Containment     -->
  <!-- ======================================================== -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Drop external attacker IP upon SSH brute-force detection -->
  <active-response>
    <command>firewall-drop</command>
    <location>defined-agent</location>
    <agent_id>002</agent_id>
    <rules_id>5712, 100011</rules_id>
    <timeout>1200</timeout>
  </active-response>

  <!-- ======================================================== -->
  <!-- THREAT INTELLIGENCE: Automated VirusTotal API Integration -->
  <!-- ======================================================== -->
  <integration>
    <name>virustotal</name>
    <api_key><YOUR_VIRUSTOTAL_API_KEY></api_key>
    <group>syscheck</group>
    <alert_format>json</alert_format>
  </integration>

  <!-- Vulnerability Detection Module -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

</ossec_config>
