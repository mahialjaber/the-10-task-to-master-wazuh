<!--
  Wazuh Agent Configuration - Windows 11 Enterprise
  Author: Mahi Al Jaber (github.com/mahialjaber)
  Target Node: windows-vm-01 (192.168.198.129 | Agent 001)
  Path: C:\Program Files (x86)\ossec-agent\ossec.conf
-->

<ossec_config>
  <client>
    <server>
      <address>192.168.198.130</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ======================================================== -->
  <!-- REAL-TIME FILE INTEGRITY MONITORING (FIM)                -->
  <!-- ======================================================== -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    
    <!-- Monitor Common Malware Staging & Drop Directory -->
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Users\Public</directories>
    
    <!-- System Binaries -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32</directories>
  </syscheck>

  <!-- ======================================================== -->
  <!-- LOG INGESTION: Windows Events & Sysmon Pipeline           -->
  <!-- ======================================================== -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</ossec_config>
